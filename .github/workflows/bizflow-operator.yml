name: BizFlow Operator

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-operator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BizFlow
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BizFlow Operator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          RUN_ONCE: "true"
          PROSPECTING_ENABLED: "true"
          PROSPECT_QUERIES_PER_RUN: "2"
          PROSPECT_RESULTS_PER_QUERY: "5"
        run: |
          python automation_engine.py
