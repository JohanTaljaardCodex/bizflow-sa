<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BizFlow SA — AI-powered small business growth system.">
    <title>{% block title %}BizFlow SA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="public-body">

<header class="public-header">
    <div class="public-nav">
        <a href="{{ url_for('home') }}" class="brand brand-public">
            <div class="bf-logo"><span>B</span></div>
            <div class="brand-name">BIZFLOW <b>SA</b></div>
        </a>

        <nav class="public-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('growth_system') }}">Growth System</a>
            <a href="{{ url_for('pricing') }}">Packages</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('contact_page') }}">Contact</a>
        </nav>

        <div class="public-nav-actions">
            <a href="{{ url_for('operator_login') }}" class="public-login">Operator</a>
            <a href="{{ url_for('contact_page') }}" class="btn-purple small">Get Started</a>
        </div>
    </div>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="site-footer">
    <div class="site-footer-inner">
        <div>
            <div class="brand">
                <div class="bf-logo small"><span>B</span></div>
                <div class="brand-name">BIZFLOW <b>SA</b></div>
            </div>
            <p>Smarter systems. Stronger businesses.</p>
        </div>

        <div class="footer-links">
            <a href="{{ url_for('growth_system') }}">Growth System</a>
            <a href="{{ url_for('pricing') }}">Packages</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('contact_page') }}">Contact</a>
        </div>
    </div>
    <div class="footer-bottom">© 2026 BizFlow SA · South Africa</div>
</footer>

</body>
</html>
